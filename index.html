<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">

        <title>Mini Games</title>

        <link rel="stylesheet" href="./css/index.css">
        <link rel="stylesheet" href="./css/sigma.css">
        <link rel="stylesheet" href="./css/shadowBox.css">
        <link rel="stylesheet" href="./css/memories.css">
        <link rel="stylesheet" href="./css/jeuHoraire.css">
        <link rel="stylesheet" href="./css/gameOver.css">
        <link rel="stylesheet" href="./css/cible.css">

        <link rel="icon" type="image/x-icon" href="./img/favicon.ico">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>


    <body>
        <audio id="background-music" autoplay loop preload="auto">
            <source src="./audio/musique.mp3" type="audio/mp3">
            Votre navigateur ne supporte pas la balise audio.
        </audio>

        <main class="main-container">
            <img class="img-bg" src="/img/background.jpg">

            <div id="game-container" class="game-container">
                <h1 id="main-title" class="main-title">RANDOM MINI-GAMES</h1>

                <div class="main-content">
                    <button class="main-button">DÉMARRER LE JEU</button>

                    <button class="main-button" onclick="loadSettings()">PARAMÈTRES</button>
                </div>
                
                <div class="progress-block"></div>
            </div>

            <div class="settings-container">
                <h1>PARAMETRES</h1>
            
                <div class="setting-item">
                    <label for="volume">Volume</label>
                    <input id="volume" class="volume-slider" type="range" min="0" max="100" value="50">
                </div>
            
                <div class="setting-item toggle-container">
                    <label for="sound-toggle">Son</label>
                    <label class="toggle-switch">
                    <input id="sound-toggle" type="checkbox" checked>
                    <span class="slider"></span>
                    </label>
                </div>
    
                <a href="./index.html">
                    <button class="back-button main-button">RETOUR</button>
                </a>
            </div>
        </main>

       <script src="./js/index.js"></script>

    </body>
</html>
