<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">

        <!-- Titre de la page à coté de l'icone-->
        <title>Mini Games</title>
        <!-- Mise en page qui va décorer la page -->
        <link rel="stylesheet" href="./css/index.css">
        <link rel="stylesheet" href="./css/sigma.css">
        <link rel="stylesheet" href="./css/tapeLeMot.css">
        <link rel="stylesheet" href="./css/memories.css">
        <link rel="stylesheet" href="./css/jeuHoraire.css">
        <link rel="stylesheet" href="./css/gameOver.css">
        <link rel="stylesheet" href="./css/cible.css">

         <!-- Mini-icône en haut de la page -->
        <link rel="icon" type="image/x-icon" href="./img/favicon.ico">

        <!-- Polices de texte (ou fonts si tu veux) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    </head>


    <body>
        <!-- Je fais un conteneur de base pour le centrer et faire un beau fond. -->
        <main class="main-container">
            <!-- J'ajoute un Wario à gauche du conteneur -->
            <img src="./img/wario.png" class="wario-left"></img>
            <!-- J'ajoute un Wario à droite du conteneur -->
            <img src="./img/wario.png" class="wario-right"></img>

            <div id="game-container">
                <!-- Titre du jeu qui est normalement "RANDOM MINI-GAMES" -->
                <h1 class="main-title"></h1>

                <div class="main-content">
                    <!-- Bouton pour démarrer le jeu -->
                    <button class="main-button">DÉMARRER LE JEU</button>

                    <!-- Bouton pour voir les paramètres -->
                    <button class="main-button">PARAMÈTRES</button>
                </div>
                
                <!-- TO-DO: faire une barre de progression -->
                <div class="progress-block"></div>
            </div>
        </main>

        <!-- Mise en page qui va permettre les intéractions -->
       <script src="./js/index.js"></script>
       

    </body>
</html>
