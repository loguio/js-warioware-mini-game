<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole Game</title>
    <link rel="stylesheet" href="../css/shadowBox.css">
</head>
<body>
    <!-- Zone des ombres -->
    <div class="shadows">
        <img class="shadow" id="shadow-1" src="../img/arrosoir.png"/>
        <img class="shadow" id="shadow-2" src="../img/biere.png"/>
        <img class="shadow" id="shadow-3" src="../img/cars.png"/>
        <img class="shadow" id="shadow-3" src="../img/ducati.png"/>
    </div>
    
    <!-- Zone du tiroir -->
    <div class="drawer">
        <img class="object" id="object-1" draggable="true" src="../img/arrosoir.png"/>
        <img class="object" id="object-2" draggable="true" src="../img/biere.png"/>
        <img class="object" id="object-3" draggable="true" src="../img/cars.png"/>
        <img class="object" id="object-3" draggable="true" src="../img/ducati.png"/>
    </div>
    <script src="../js/shadowBox.js"></script>
</body>
</html>
