
<div class="game-container">
    <!-- Titre principal -->
    <h1>Remets à l'heure</h1>
  
    <!-- Timer - Affiché sous le titre -->
    <div id="timer-horaire">Temps restant : 10s</div>
  
    <!-- Horloge fixe (placée en haut à droite) -->
    <div id="fixed-clock" class="clock-face">
      <div id="fixed-hour" class="hand hour"></div>
      <div id="fixed-minute" class="hand minute"></div>
    </div>
  
    <!-- Horloge modifiable (centrée) -->
    <div id="adjustable-clock" class="clock-face">
      <div id="adjustable-hour" class="hand hour"></div>
      <div id="adjustable-minute" class="hand minute"></div>
    </div>
  
    <!-- Résultat ou message après l'interaction avec l'horloge -->
    <div id="result"></div>
</div>
