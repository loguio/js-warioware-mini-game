<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu d'horloge</title>
  <link rel="stylesheet" href="../css/jeuHoraire.css">
</head>
<body>
    <div class="game-container">
        <h1>Remet à l'heure</h1>
        <div id="timer">Temps restant : 10s</div>
      
        <!-- Horloge fixe -->
        <div id="fixed-clock" class="clock-face">
          <div id="fixed-hour" class="hand hour"></div>
          <div id="fixed-minute" class="hand minute"></div>
        </div>
      
        <!-- Horloge modifiable -->
        <div id="adjustable-clock" class="clock-face">
          <div id="adjustable-hour" class="hand hour"></div>
          <div id="adjustable-minute" class="hand minute"></div>
        </div>
      
        <div id="result"></div>
      </div>      
  <script src="../js/jeuHoraire.js"></script>
</body>
</html>
